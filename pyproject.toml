[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanml"
version = "0.1.0"
description = "A small machine learning preprocessing library for cleaning and preparing datasets."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Berkin Özcan" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cleanml*"]